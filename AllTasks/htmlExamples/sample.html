<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--<div class="box">Hello</div>
    <div id="sample">hello</div>
    -->

    <h1>Hello</h1>

    <style>
        .box{
            width: 500px;
            height: 500px;
            border-style: solid;
            border-color: black;
            border-width: 4px;
            border-left: dashed 4px blueviolet;
            border-radius: 15px;

            margin: 50px 10px;
            padding-left: 50px;

            background-color: bisque;
            background-image: url('./assets/bookImage.jpg');
            background-repeat: no-repeat;
            background-size: auto;
            background-position: center;
            
        }

        #sample{
            width: 500px;
            height: 500px;
            border-style: solid;
            border-color: black;
            border-width: 4px;
            transform: scale(11111112);
        }

        h1{
            color: blueviolet;

            @media print{
                color: aqua;
            }

            @media print and (orientation:landscape) {
                color: brown;
            }

            @media print and (orientation:portrait) {
                color: blue;
            }

            @media  screen and (max-width:600px) {
                color: chartreuse;
            }

            @media all {
                color: black;
            }

            @media screen and (max-width:500px) {
                color: aqua;
            }

            @media screen and (min-width:700px) {
                color: rgb(255, 59, 229);
            }
        }


    </style>
</body>
</html>
