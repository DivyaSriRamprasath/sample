    <script>
      var movie = [];

      getMovieData();
      function getMovieData(){
        let movieApi = "https://retoolapi.dev/6z1OKW/BookifyMovie";

        fetch(movieApi)
        .then(response => response.json())
        .then(responseData => {
          movie = responseData;
          generateMovie(movie);
        })
        .catch(error => console.error("Error fetching movie data:", error));
      }

      function checkSession(mId){
          let userIdSes = sessionStorage.getItem('userId') || '';
          if(userIdSes == ''){
            alert("Please login to Book tickets...");
            window.location.href = "login.html";
          }
          else
          goToMovieDetails(mId);
        }

      function goToMovieDetails(mId){
        sessionStorage.setItem('movieId', mId);
        // sessionStorage.setItem('movieName', mName);
        window.location.href = "bookMovie.html";
      }

      // dynamically generating cards
      function generateMovie(){
        let result = "";
        console.log(movie);
        
        for(let num=0; num<4; num++){
          if(num == 0)
            result += '<div class="row" style="margin-left: 107px; margin-right: 55px">';
          
          result += '<div class="col">' +
            '<div class="card" style="width: 15rem;">' +
              '<img src="../assets/cardImgs/'+ movie[num].mImg +'.jpg" class="card-img-top" alt="...">' +
              '<div class="card-body">' +
                '<h5 class="card-title">'+ movie[num].mName +'</h5>' +
                '<input type="hidden" class="movie-id" value="kadaisiulagapor">' +
                '<p class="card-text">Action/Drama/Thriller</i></p>' +
                '<button type="button" class="btn btn-danger" onclick="checkSession('+movie[num].id+')">Book Tickets</a>' +
              '</div>' +
            '</div>' +
          '</div>';
          
          if(num == 3){
            result += '</div>';
          }
        }
        console.log(result);
        document.getElementById('cardRows').innerHTML = result;
      }
      // generateMovie();
    </script>
