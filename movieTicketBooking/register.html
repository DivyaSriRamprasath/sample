      <form>
        <!-- margin-left: 240px; -->
        <div class="container mt-5" style="align-content: center; height: 300px; width: 600px;">
            <h2 style="text-align: center;">Register</h2>
            <div class="row mb-2 mt-4">
                <div class="col"><label for="username">Enter your mail id</label></div>
                <div class="col"><input type="text" id="mail" name="mail"/></div>
            </div>

            <div class="row mt-4">
              <div class="col"><label for="password">Enter your User name</label></div>
              <div class="col"><input type="text" id="username" name="username"/></div>
          </div>
    
            <div class="row mt-4">
                <div class="col"><label for="password">Enter Password</label></div>
                <div class="col"><input type="password" id="password" name="password"/></div>
            </div>
    
            <div class="row mt-4">
                <div class="col"><label for="confirmPassword">Confirm Password</label></div>
                <div class="col"><input type="password" id="confirmPassword" name="confirmPassword"/></div>
            </div>
            <div class="row mt-4">
              <div class="col"><label for="mobile">Enter your mobile no</label></div>
              <div class="col"><input type="number" id="mobile" name="mobile"/></div>
          </div>
    
            <div class="row mt-4">
                <div class="col"></div>
                <div class="col">
                  <button type="reset" class="btn btn-secondary">Cancel</button>
                  <button type="button" class="btn btn-danger" onclick="getInputs()">Submit</button>
                </div>
            </div>
        </div>
      </form>
  
      <script>
        function getInputs() {
        let email = document.getElementById('mail').value || '';
        const uName = document.getElementById('username')?.value || '';
        const password = document.getElementById('password')?.value || '';
        const confirmPassword = document.getElementById('confirmPassword')?.value || '';
        let mobile = document.getElementById('mobile').value || '';

    
        // Email validation
        const emailPattern = /^[a-zA-Z0-9._-]+@[a-zA-Z]+\.[a-zA-Z]{2,6}$/;
        if (!emailPattern.test(email)) {
            console.log("Invalid email format");
            alert("Please enter a valid email address.");
            return;
        }
        // Password match validation
        if (password !== confirmPassword) {
            console.log("Passwords do not match");
            alert("Passwords do not match. Please try again.");
            return;
        }
        else{
            let requestBody = {
                email : email,
                mobile : mobile,
                accName : uName,
                password : password,
                userName : uName,
                userType : 'customer'
            }
            // in functionalities.js to add the user to api
            registerUser(requestBody);
        }
        
    }
      </script>
