      <script>
        var bookifyUserApi = "https://retoolapi.dev/btlKGc/BookifyUser";

        function getProfileData(){
            let userId = sessionStorage.getItem('userId') || '';

            fetch(bookifyUserApi+'/'+userId)
            .then(response => response.json())
            .then(responseData => {
                document.getElementById('username').value = responseData.userName || '';
                document.getElementById('name').value = responseData.accName || '';
                document.getElementById('email').value = responseData.email || '';
                document.getElementById('mobile').value = responseData.mobile || '';
                document.getElementById('address').value = responseData.address || '';
            })
        }
        getProfileData();

        function updateProfile(){
            let userId = sessionStorage.getItem('userId') || '';
            let userName = document.getElementById('username').value || '';
            let accName = document.getElementById('name').value || '';
            let email = document.getElementById('email').value || '';
            let mobile = document.getElementById('mobile').value || '';
            let address = document.getElementById('address').value || '';

            let requestBody = {
                userName : userName,
                accName : accName,
                email : email,
                mobile : mobile,
                address : address
            };

            let request = {
                method : 'PATCH',
                headers : {'Content-Type' : 'application/json'},
                body : JSON.stringify(requestBody)
            }

            fetch(bookifyUserApi+'/'+userId, request)
            .then(response => {
                if(response.ok){
                    alert('profile updated successfully...');
                }
                else{
                    alert('Error occured... Please try again later');
                }
            })
        }

      </script>
