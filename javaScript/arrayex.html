            function arrExample(){

                arrResult += "Pop : "+ arr.pop() + "<br>";
                arrResult += "Array : "+ arr + "<br>";
                arrResult += "Shift : "+ arr.shift() + "<br>";
                arrResult += "Array : "+ arr + "<br>";
                arrResult += "Unshift 27 : "+ arr.unshift(27) + "<br>";
                arrResult += "Array : "+ arr + "<br>";
                arrResult += "Includes 47 : "+ arr.includes(47) + "<br>";
                arrResult += "Includes 100 : "+ arr.includes(100) + "<br>";
                arrResult += "Index Of 86 : "+ arr.indexOf(86) + "<br>";
                arrResult += "Last Index of 86 : "+ arr.lastIndexOf(86) + "<br>";
                arrResult += "Index Of 100 : "+ arr.indexOf(100) + "<br>";
                arrResult += "Sort : "+ arr.sort() + "<br>";
                arrResult += "Array : "+ arr + "<br>";
                arrResult += "Reverse : "+ arr.reverse() + "<br>";

                arrResult += "Splice Add 2Idx 500,600: "+ arr.splice(2,0,[500,600]) + "<br>";
                arrResult += "Array : "+ arr + "<br>";
                arrResult += "Splice Update 4Idx 555: "+ arr.splice(4,1,555) + "<br>";

            arrExample();

            function arrPush(arr, element){
                arr[arr.length] = element;
                console.log("push: " +arr);
                return arr.length;
            }
            console.log("Push : " + arrPush([20,30,10], 23));

            function arrPop(arr){
                console.log("popped element: " +arr[arr.length-1]);
                arr.length = arr.length-1;
                console.log("arr after pop: " +arr);
                // return arr[arr.length];
            }
            arrPop([10,20,30]);

            function arrShift(arr){
                // console.log("shift: " +arr[0]);
                // arrReverse(arr);
                // arr.length = arr.length-1;
                // arrReverse(arr);
                // console.log("array after shift: " +arr);
                console.log("shift: " + arr[0]);
                for(let idx=0; idx<arr.length; idx++){
                    arr[idx] = arr[idx+1]
                    
                }
                arr.length-=1;
                console.log("array after shift: " +arr);
            }
            arrShift([10, 20, 30]);

            function arrUnshift(arr, element){
                for(let i=arr.length-1; i>=0; i--){
                    arr[i+1] = arr[i];
                }
                arr[0] = element;
                console.log("unshift: " +arr.length);
                console.log("Array after unshift: " +arr);
            }
            arrUnshift([20,30,40], 1);
            arrUnshift([23, 45, 78, 90], 123);

            function arrIncludes(arr, element1){
                for(let i=0; i<=arr.length; i++){
                    if(arr[i] == element1){
                        return true;
                    }
                }
                return false;
            }
            console.log("includes: " +arrIncludes([20,30,40], 20));
            console.log("includes: " +arrIncludes([20,30,40], 10));

            function arrIndexOf(arr, element){
                for(let i=0; i<=arr.length; i++){
                    if(arr[i] == element){
                        return i;
                    }
                }
                return -1;
            }
            console.log("index of: " +arrIndexOf([20, 30, 40, 50], 40));
            console.log("index of: " +arrIndexOf([20, 30, 40, 50], 3));   
            
            function arrLastIndexOf(arr, element){
                for(let i=arr.length; i>=0; i--){
                    if(arr[i] == element){
                        return i;
                    }
                }
                return -1;
            }
            console.log("Last index of: " + arrLastIndexOf([12, 45, 12, 98, 34, 45, 12, 1], 12));
            console.log("Last index of: " + arrLastIndexOf([12, 45, 12, 98, 34, 45, 12, 1], 123));

            function arrSort(arr){
                let iterator = 0;
                while(iterator <= arr.length){
                    for(let idx=0; idx<=arr.length; idx++){
                    // if(i==arr.length){
                    //     break;
                    // }
                    
                    if(arr[idx+1] < arr[idx]){
                        temp = arr[idx];
                        arr[idx] = arr[idx+1];
                        arr[idx+1] = temp;
                    }
                } 
                iterator++;  
            }
                console.log("sorted array: " +arr);
            }
            arrSort([23, 12, 9, 1, 56, 2]);
            arrSort([34, 78, 12, 990, -32, 12, 89, 1, 0, 256]);

            // arrReverse([10, 20, 30, 40]);

            function arrReverse(arr){
                let left = 0;
                let right = arr.length-1;
                while(left < right){
                    let temp = arr[left];
                    arr[left] = arr[right];
                    arr[right] = temp;

                    left++;
                    right--;
                }
                console.log("reverse: " +arr);
            }
            arrReverse([10, 20, 30, 40]);

            function arrSlice(arr, start, end){
                let arrTemp = "";
                for(let idx=start; idx<=end; idx++){
                    arrTemp += arr[idx] + " ";
                }
                console.log("array slice: " +arrTemp);
            }
            arrSlice([20, 30, 40, 50, 60], 1, 3);

            function arrFill(arr, fillValue, start, end){
                for(let idx=start; idx<=end; idx++){
                    arr[idx] = fillValue;
                }
                console.log("array fill: " +arr);
            }
            arrFill([10, 20, 30, 40, 50, 60, 70], 0, 2, 4);

            function arrJoin(arr, joinElement){
                arrTemp = "";
                for(let idx=0; idx<arr.length; idx++){
                    if(idx == arr.length-1){
                        arrTemp += arr[idx];
                        break;
                    }
                    arrTemp += arr[idx] + " " + joinElement + " ";
                }
                console.log(arrTemp);
            }
            arrJoin(["abc", "qwerty", "123", "xyz"], "and");
